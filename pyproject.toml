[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftedit"
version = "0.1.0"
description = "One-step text-guided image editing, adapted for virtual try-on"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause-Clear" }

dependencies = [
    "accelerate",
    "diffusers==0.22.0",
    "einops",
    "ftfy",
    "huggingface-hub==0.25.2",
    "Jinja2",
    "numpy>=1.26,<2",
    "pillow",
    "safetensors",
    "tensorboard",
    "torch==2.2.1",
    "torchaudio==2.2.1",
    "torchvision==0.17.1",
    "transformers==4.37.2",
]

[project.optional-dependencies]
vton = [
    "datasets",
    "opencv-python-headless",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# --------------------------------------------------------------------------------------
# Linting and formatting
# --------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "scripts", "tests"]
# The notebook is generated by notebooks/_build_notebook.py, which is linted instead.
# Notebook cells legitimately interleave imports with IPython magics.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ARG",  # unused arguments
    "D",    # pydocstyle
    "ANN",  # missing annotations
    "RUF",
]
ignore = [
    "ANN401",  # Any is legitimate in **kwargs pass-throughs
    "D105",    # magic methods are self-describing
    "D107",    # Google style documents __init__ args in the class docstring
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "B008",    # dataclass field(default_factory=...) reads as a call in defaults
    "N812",    # torch.nn.functional as F is the universal convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN", "ARG"]
"scripts/*" = ["D100"]
# Prose destined for markdown cells: en dashes and long lines are intentional.
"notebooks/_build_notebook.py" = ["RUF001", "E501"]
# Processor __call__ signatures are fixed by the diffusers protocol: the trailing
# *args/**kwargs must be accepted and ignored, and the class names are load-bearing
# for checkpoint compatibility.
"src/attention/*.py" = ["ARG002", "N802", "N803"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
line-ending = "lf"

# --------------------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: requires downloading pretrained weights",
]
